<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Any Video to MP4</title>
<style>
:root{--bg:#0f1b2d;--panel:#182a44;--line:#2c4468;--ink:#f3f6fa;--mute:#9db0c9;--go:#ffc53d;--ok:#5be3a1;--bad:#ff7a7a}
*{box-sizing:border-box}
html{font-size:clamp(16px,1.4vw + 10px,26px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:1.5rem}
main{width:100%;max-width:38rem}
h1{font-size:2rem;margin:0 0 .3rem;letter-spacing:-.02em}
p.sub{margin:0 0 1.5rem;color:var(--mute)}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:1rem;padding:1.25rem}
button,label.pick,select{font:inherit;color:inherit}
label.pick,button.go,a.save{display:block;width:100%;text-align:center;padding:1rem;border-radius:.75rem;font-weight:700;cursor:pointer;border:3px solid transparent;text-decoration:none}
label.pick{background:transparent;border:3px dashed var(--line);color:var(--ink)}
button.go,a.save{background:var(--go);color:#1a1300;margin-top:1rem}
a.save{background:var(--ok)}
button:disabled{opacity:.45;cursor:not-allowed}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
:is(label.pick,button,a,select):focus-visible,input:focus-visible+label.pick{outline:4px solid #fff;outline-offset:3px}
label.pick:hover{border-color:var(--go)}
.row{display:flex;gap:.75rem;align-items:center;margin-top:1rem}
.row span{color:var(--mute)}
select{flex:1;background:var(--bg);border:2px solid var(--line);border-radius:.6rem;padding:.7rem}
.bar{height:.9rem;background:var(--bg);border-radius:1rem;overflow:hidden;margin-top:1rem;display:none}
.bar i{display:block;height:100%;width:0;background:var(--go);transition:width .3s}
#msg{min-height:1.5em;margin:1rem 0 0;color:var(--mute)}
#msg.err{color:var(--bad)}
video{width:100%;margin-top:1rem;border-radius:.75rem;background:#000;display:none}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main>
<h1>Any video to MP4</h1>
<p class="sub">Pick a video. Get an MP4 that plays on phones, laptops and TVs. Nothing is uploaded; conversion happens on your device.</p>
<div class="panel">
  <input type="file" id="file" accept="video/*,.mkv,.avi,.mov,.flv,.wmv,.webm,.ts,.3gp,.mpg,.mpeg">
  <label class="pick" for="file" id="pickLabel" tabindex="0">Choose a video</label>
  <div class="row"><span>Quality</span>
    <select id="q">
      <option value="28">Small file (fastest)</option>
      <option value="23" selected>Balanced</option>
      <option value="18">Best quality (slowest)</option>
    </select>
  </div>
  <button class="go" id="go" disabled>Convert to MP4</button>
  <div class="bar" id="bar"><i id="fill"></i></div>
  <p id="msg" role="status" aria-live="polite"></p>
  <video id="preview" controls playsinline></video>
  <a class="save" id="save" style="display:none">Save MP4</a>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script>
const $=id=>document.getElementById(id);
const CDN='https://cdn.jsdelivr.net/npm/';
let ff=null,file=null;
const say=(t,err)=>{$('msg').textContent=t;$('msg').className=err?'err':''};
const blobURL=async(u,t)=>URL.createObjectURL(new Blob([await (await fetch(u)).arrayBuffer()],{type:t}));
$('pickLabel').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file').click()}});
$('file').addEventListener('change',e=>{
  file=e.target.files[0]||null;
  $('go').disabled=!file;
  $('save').style.display=$('preview').style.display='none';
  if(file){$('pickLabel').textContent=file.name;say(`${(file.size/1048576).toFixed(1)} MB ready.`)}
});
async function load(){
  if(ff)return ff;
  say('Loading the converter (one time, about 30 MB)...');
  const {FFmpeg}=FFmpegWASM;
  ff=new FFmpeg();
  ff.on('progress',({progress})=>{const p=Math.min(100,Math.max(0,Math.round(progress*100)));$('fill').style.width=p+'%';say(`Converting... ${p}%`)});
  await ff.load({
    classWorkerURL:await blobURL(CDN+'@ffmpeg/ffmpeg@0.12.10/dist/umd/814.ffmpeg.js','text/javascript'),
    coreURL:await blobURL(CDN+'@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js','text/javascript'),
    wasmURL:await blobURL(CDN+'@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.wasm','application/wasm')
  });
  return ff;
}
$('go').addEventListener('click',async()=>{
  if(!file)return;
  $('go').disabled=true;$('bar').style.display='block';$('fill').style.width='0';
  try{
    const f=await load();
    const ext=(file.name.split('.').pop()||'mp4').toLowerCase().replace(/[^a-z0-9]/g,'');
    await f.writeFile('input.'+ext,new Uint8Array(await file.arrayBuffer()));
    say('Converting... 0%');
    const code=await f.exec(['-i','input.'+ext,'-c:v','libx264','-preset','ultrafast','-crf',$('q').value,
      '-pix_fmt','yuv420p','-vf','scale=trunc(iw/2)*2:trunc(ih/2)*2','-c:a','aac','-b:a','160k','-movflags','+faststart','out.mp4']);
    if(code!==0)throw new Error('This file could not be converted.');
    const data=await f.readFile('out.mp4');
    const url=URL.createObjectURL(new Blob([data.buffer],{type:'video/mp4'}));
    const name=file.name.replace(/\.[^.]+$/,'')+'.mp4';
    $('preview').src=url;$('preview').style.display='block';
    $('save').href=url;$('save').download=name;$('save').style.display='block';
    $('fill').style.width='100%';say('Done. Preview it or save it.');
    await f.deleteFile('input.'+ext);await f.deleteFile('out.mp4');
  }catch(err){
    say((err&&err.message)||'Something went wrong. Try a smaller file or reload the page.',true);
  }
  $('go').disabled=false;
});
</script>
</body>
</html>
